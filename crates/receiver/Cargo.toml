[package]
name = "soundclud-receiver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified multi-output bit-perfect audio receiver daemon for SoundClud"
default-run = "soundclud-receiver"

[dependencies]
aes = "0.8"
axum = { version = "0.8", features = ["json", "ws"] }
bytes = "1"
cbc = { version = "0.1", features = ["alloc"] }
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "wav"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.26"

[lints]
workspace = true

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_targets: ""
          - os: macos-14
            rust_targets: "x86_64-apple-darwin"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Audit npm dependencies (high/critical)
        run: npm audit --audit-level=high

      - name: Run Zero-PII & portability hygiene gate
        run: npm run check:hygiene

      - name: Build and validate Chromium MV3 extension bundle
        run: npm run package:extension

      - name: Run strict TypeScript typecheck
        run: npm run typecheck

      - name: Run offline unit tests
        run: npm test

      - name: Run Rust format, clippy, and unit tests
        run: npm run check:rust

      - name: Verify macOS Monterey Intel target (x86_64-apple-darwin, MACOSX_DEPLOYMENT_TARGET=11.0)
        if: matrix.os == 'macos-14'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: MACOSX_DEPLOYMENT_TARGET=11.0 cargo check --workspace --target x86_64-apple-darwin

      - name: Verify Universal 2 macOS AppKit GUI (arm64 + x86_64, macosx11.0) & Info.plist
        if: matrix.os == 'macos-14'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          bash -n \
            packaging/install/install.sh \
            packaging/install/uninstall.sh \
            packaging/launchd/run-receiver.sh \
            scripts/build-macos-dmg.sh
          TMP_APP_VERIFY="$(mktemp -d)"
          trap 'rm -rf "${TMP_APP_VERIFY}"' EXIT
          sed 's/{{VERSION}}/0.1.0/g' packaging/macos-app/Info.plist.tmpl > "${TMP_APP_VERIFY}/Info.plist"
          plutil -lint -s "${TMP_APP_VERIFY}/Info.plist"
          plutil -lint -s packaging/macos-app/Info.plist.tmpl
          plutil -lint -s packaging/launchd/io.soundclud.receiver.plist.tmpl
          swiftc -parse-as-library -O -target arm64-apple-macosx11.0 \
            packaging/macos-app/Sources/*.swift \
            -o "${TMP_APP_VERIFY}/SoundClud-arm64"
          swiftc -parse-as-library -O -target x86_64-apple-macosx11.0 \
            packaging/macos-app/Sources/*.swift \
            -o "${TMP_APP_VERIFY}/SoundClud-x86_64"
          lipo -create \
            "${TMP_APP_VERIFY}/SoundClud-arm64" \
            "${TMP_APP_VERIFY}/SoundClud-x86_64" \
            -output "${TMP_APP_VERIFY}/SoundClud"
          ARCHS="$(lipo -archs "${TMP_APP_VERIFY}/SoundClud")"
          echo "Verified Universal SoundClud AppKit architectures: ${ARCHS}"
          [[ " ${ARCHS} " == *" arm64 "* ]]
          [[ " ${ARCHS} " == *" x86_64 "* ]]
